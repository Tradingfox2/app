<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Night Studio — set logger</title>
  <link rel="stylesheet" href="studio.css" />
  <style>
    table { width: calc(100% - 32px); margin: 0 16px; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; letter-spacing: 0.4px; text-transform: uppercase; color: var(--dim); font-weight: 600; padding: 8px 0; }
    td { padding: 10px 0; border-top: 1px solid var(--border); font-size: 18px; }
    td.num, th.num { font-family: var(--font-num); font-size: 20px; letter-spacing: -0.3px; }
    .rest {
      margin: 16px;
      padding: 16px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .rest strong { font-family: var(--font-num); font-size: 40px; font-weight: 400; letter-spacing: -0.4px; }
    .bar { display: flex; gap: 8px; padding: 0 16px 16px; }
    .field {
      flex: 1;
      min-height: 56px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface2);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 12px;
    }
    .field b { font-family: var(--font-num); font-size: 22px; font-weight: 400; }
    .link { margin: 0 16px; color: var(--text); font-size: 15px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="pad">
      <p class="eyebrow">Set 3 of 4 · quads</p>
      <p class="display" style="font-size:36px;line-height:38px">Back squat</p>
      <p class="caption" style="margin-top:6px">Saving the last set on this phone. Sample data is not shown here.</p>
    </div>
    <table>
      <thead><tr><th>Set</th><th>Kg</th><th>Reps</th></tr></thead>
      <tbody>
        <tr><td>1</td><td class="num">100</td><td class="num">5</td></tr>
        <tr><td>2</td><td class="num">100</td><td class="num">5</td></tr>
        <tr><td>3</td><td class="num">100</td><td class="num">4</td></tr>
      </tbody>
    </table>
    <div class="rest">
      <div>
        <p class="eyebrow">Rest</p>
        <strong>01:12</strong>
      </div>
      <button class="btn-quiet" type="button">Skip</button>
    </div>
    <div class="bar">
      <div class="field"><span class="dim" style="font-size:12px">KG</span><b>100</b></div>
      <div class="field"><span class="dim" style="font-size:12px">REPS</span><b>5</b></div>
    </div>
    <div class="pad" style="padding-top:0">
      <button class="btn block" type="button">Log set</button>
    </div>
    <p class="link">Watch the squat demo</p>
    <p class="caption" style="padding:8px 16px 0">The demo opens as a letterboxed video. This screen stays a ledger.</p>
  </div>
</body>
</html>
