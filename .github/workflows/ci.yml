name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: ironflow_ci
      JWT_SECRET: ci-only-secret-not-used-outside-this-job
      # Realtime and the heavy moderation model stay off: both are designed to
      # degrade to a no-op, and CI asserts that fallback rather than the service.
      LLM_PROVIDER: none
      MODERATION_BACKEND: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed reference data
        working-directory: backend
        # backend_test.py signs in as demo@ironflow.app, which the seed creates.
        run: python seed_scripts/seed.py

      - name: Start the API
        working-directory: backend
        run: |
          # Part of the suite drives a live server over HTTP rather than calling
          # the routers directly, so CI has to run one.
          uvicorn server:app --host 127.0.0.1 --port 8001 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/api/ >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "API did not become ready in 30s" >&2
          exit 1

      - name: Run tests
        working-directory: backend
        env:
          EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npx eslint .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: frontend
        env:
          # Every /api call is intercepted by the specs, so this only has to be
          # a well-formed origin — no backend is contacted.
          EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8001
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
